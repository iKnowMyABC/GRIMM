<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRIMM [grmm] — S2 Scattered Supplies Tracker</title>
  
  <!-- Leaflet & Cinzel Fonts -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100%;
      background: #090d12;
      font-family: 'Inter', sans-serif;
      color: #c4d0dc;
      overflow: hidden;
    }

    #map { width: 100%; height: 100vh; background: #070a0e; }

    /* =========================================
       TOP WAR HEADER & HUD
    ========================================= */
    .war-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(10, 14, 19, 0.94);
      border-bottom: 1px solid rgba(209, 138, 69, 0.35);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .header-brand {
      display: flex;
      flex-direction: column;
    }
    .header-tag {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 2.5px;
      color: #d18a45;
      font-weight: 700;
    }
    .header-title {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      letter-spacing: 1.5px;
      color: #f0bd75;
      font-weight: 700;
      margin: 0;
      text-transform: uppercase;
    }

    .hub-link {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #c4d0dc;
      text-decoration: none;
      border: 1px solid rgba(209, 138, 69, 0.4);
      padding: 7px 14px;
      border-radius: 3px;
      background: rgba(209, 138, 69, 0.08);
      transition: all 0.2s ease;
      font-weight: 600;
    }
    .hub-link:hover {
      background: rgba(209, 138, 69, 0.25);
      border-color: #f0bd75;
      color: #f0bd75;
    }

    /* Input HUD Controls */
    .top-panel {
      position: absolute;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(13, 18, 24, 0.95);
      border: 1px solid rgba(209, 138, 69, 0.4);
      border-radius: 4px;
      padding: 6px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
    }

    .coord-field {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #090d12;
      border: 1px solid rgba(209, 138, 69, 0.3);
      padding: 4px 8px;
      border-radius: 3px;
    }
    .coord-field span {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: #f0bd75;
      font-size: 11px;
    }
    .coord-field input {
      background: transparent;
      border: none;
      outline: none;
      color: #f5ede2;
      width: 46px;
      font-weight: 600;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }

    select.type-select {
      background: #090d12;
      border: 1px solid rgba(209, 138, 69, 0.3);
      color: #c4d0dc;
      padding: 6px 10px;
      border-radius: 3px;
      font-size: 12px;
      font-family: 'Cinzel', serif;
      outline: none;
      cursor: pointer;
    }

    .btn-action {
      background: linear-gradient(135deg, #a66a2e, #825021);
      border: 1px solid #f0bd75;
      color: #fff;
      padding: 6px 14px;
      border-radius: 3px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: filter 0.2s ease;
    }
    .btn-action:hover { filter: brightness(1.2); }

    .btn-secondary {
      background: #141b22;
      border: 1px solid rgba(209, 138, 69, 0.3);
      color: #9ab0c2;
      padding: 6px 12px;
      border-radius: 3px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: #1c2530;
      color: #f0bd75;
      border-color: #f0bd75;
    }

    /* Floating Bottom-Right HUD */
    .hud-coords {
      position: absolute;
      bottom: 18px;
      right: 18px;
      z-index: 1000;
      background: rgba(13, 18, 24, 0.94);
      border: 1px solid rgba(209, 138, 69, 0.4);
      padding: 6px 14px;
      border-radius: 3px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #9ab0c2;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }
    .hud-coords b { color: #f0bd75; }

    /* Toast Status Notifications */
    #status-msg {
      position: absolute;
      top: 118px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      font-size: 12px;
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 3px;
      display: none;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    .msg-error { background: #5c1818; color: #ffb4b4; border: 1px solid #c73838; }
    .msg-info { background: #183149; color: #9fd2ff; border: 1px solid #2f6ea3; }
    .msg-success { background: #164024; color: #9df0b6; border: 1px solid #288046; }

    /* Pins */
    .stronghold-pin {
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.95);
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .stronghold-pin:hover {
      transform: scale(1.6);
      z-index: 9999 !important;
    }

    .stronghold-pin.is-found {
      opacity: 0.22 !important;
      border-color: #3b434a !important;
      filter: grayscale(100%);
    }

    #map.hide-found .stronghold-pin.is-found {
      display: none !important;
    }

    /* Leaflet Popup Theme */
    .leaflet-popup-content-wrapper {
      background: rgba(13, 18, 24, 0.97) !important;
      border: 1px solid rgba(209, 138, 69, 0.5) !important;
      border-radius: 4px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9) !important;
      color: #c4d0dc !important;
    }
    .leaflet-popup-tip {
      background: rgba(13, 18, 24, 0.97) !important;
      border: 1px solid rgba(209, 138, 69, 0.5) !important;
    }

    .popup-btn {
      display: inline-block;
      width: 100%;
      margin-top: 10px;
      padding: 7px 0;
      font-size: 11px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      transition: filter 0.2s ease;
    }
    .btn-mark {
      background: linear-gradient(135deg, #266b37, #1d4e2a);
      border: 1px solid #3eb85d;
      color: #fff;
    }
    .btn-mark:hover { filter: brightness(1.2); }
    .btn-unmark {
      background: #21262d;
      border: 1px solid rgba(209, 138, 69, 0.3);
      color: #8b949e;
    }
    .btn-unmark:hover { background: #2f3640; color: #fff; }
  </style>
</head>
<body>

  <!-- Top War Bar Header -->
  <header class="war-header">
    <div class="header-brand">
      <div class="header-tag">ᛟ GRIMM ALLIANCE • SERVER 2109 ᛟ</div>
      <h1 class="header-title">Season 2 — Scattered Supplies Tracker</h1>
    </div>
    <a href="../../#home" class="hub-link">← RETURN TO HUB</a>
  </header>

  <!-- Coordinate Control Panel -->
  <div class="top-panel">
    <div class="coord-field">
      <span>X</span>
      <input type="number" id="input-x" placeholder="0" min="0" max="1000" />
    </div>
    <div class="coord-field">
      <span>Y</span>
      <input type="number" id="input-y" placeholder="0" min="0" max="1000" />
    </div>

    <select id="input-type" class="type-select">
      <option value="Level 1">Level 1</option>
      <option value="Level 2">Level 2</option>
      <option value="Level 3">Level 3</option>
      <option value="Level 4">Level 4</option>
      <option value="Level 5">Level 5</option>
      <option value="Level 6">Level 6</option>
      <option value="Level 7">Level 7</option>
      <option value="Custom Spot">Custom Spot</option>
    </select>

    <button class="btn-action" onclick="submitCoordinate()">Submit / Mark</button>
    <button class="btn-secondary" id="toggle-found-btn" onclick="toggleHideFound()">Hide Found</button>
  </div>

  <div class="hud-coords" id="hud-coords">X: 0 | Y: 0</div>
  <div id="status-msg"></div>
  <div id="map"></div>

  <!-- Leaflet and Firebase Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const FIREBASE_DB_URL = "https://season-2-supplies-default-rtdb.europe-west1.firebasedatabase.app/";

    firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
    const db = firebase.database();

    const MAP_LIMIT = 1000;
    const registeredCoords = new Map();
    const markerInstances = new Map();
    const globalFoundCoords = new Set();
    let hideFoundActive = false;

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1.5,
      maxZoom: 3,
      zoomSnap: 0.25,
      zoomDelta: 0.5,
      attributionControl: false
    });

    const bounds = [[0, 0], [MAP_LIMIT, MAP_LIMIT]];
    L.imageOverlay('season-2-grid.png', bounds).addTo(map);
    map.fitBounds(bounds);

    map.on('mousemove', (e) => {
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);
      if (x >= 0 && x <= MAP_LIMIT && y >= 0 && y <= MAP_LIMIT) {
        document.getElementById('hud-coords').innerHTML = `X: <b>${x}</b> | Y: <b>${y}</b>`;
      }
    });

    function showStatus(text, type = 'info') {
      const box = document.getElementById('status-msg');
      box.className = type === 'error' ? 'msg-error' : (type === 'success' ? 'msg-success' : 'msg-info');
      box.textContent = text;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    window.toggleFoundFirebase = function(key) {
      const isFound = globalFoundCoords.has(key);
      const safeKey = key.replace(',', '_');

      if (isFound) {
        db.ref(`found_supplies/${safeKey}`).remove();
        showStatus(`Unmarked (${key.replace('_', ',')})`, 'info');
      } else {
        db.ref(`found_supplies/${safeKey}`).set({
          timestamp: Date.now()
        });
        showStatus(`Marked found for everyone!`, 'success');
      }
    };

    function updateMarkerVisual(marker, key, data) {
      const isFound = globalFoundCoords.has(key);

      const icon = L.divIcon({
        className: `stronghold-pin ${isFound ? 'is-found' : ''}`,
        html: `<div style="width:100%;height:100%;background:${data.color};border-radius:50%;"></div>`,
        iconSize: [11, 11],
        iconAnchor: [5.5, 5.5]
      });
      marker.setIcon(icon);

      const popupHtml = `
        <div style="color: #c4d0dc; font-size: 12px; font-family: 'Inter', sans-serif; min-width: 150px; padding: 4px 2px;">
          <strong style="color: #f0bd75; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.5px;">${data.label}</strong><br/>
          <div style="margin: 4px 0; color: #8b9eb0; font-family: 'JetBrains Mono', monospace;">
            Coords: <b style="color: #fff;">(${data.x}, ${data.y})</b>
          </div>
          <div style="font-size: 11px; font-weight: 700; color:${isFound ? '#40bf6a' : '#d18a45'}; margin-bottom: 6px;">
            ${isFound ? '✓ Marked Found' : '⭕ Unclaimed'}
          </div>
          <button 
            class="popup-btn ${isFound ? 'btn-unmark' : 'btn-mark'}" 
            onclick="toggleFoundFirebase('${key}')">
            ${isFound ? 'Mark Unclaimed' : '✓ 1-Click Mark Found'}
          </button>
        </div>
      `;
      marker.bindPopup(popupHtml);
    }

    function createPin(x, y, label, color) {
      const key = `${x},${y}`;
      const marker = L.marker([y, x]).addTo(map);

      markerInstances.set(key, marker);
      updateMarkerVisual(marker, key, { x, y, label, color });
      return marker;
    }

    window.toggleHideFound = function() {
      hideFoundActive = !hideFoundActive;
      const btn = document.getElementById('toggle-found-btn');
      const mapElement = document.getElementById('map');

      btn.textContent = hideFoundActive ? "Show Found" : "Hide Found";
      btn.style.borderColor = hideFoundActive ? "#f0bd75" : "rgba(209, 138, 69, 0.3)";
      btn.style.color = hideFoundActive ? "#f0bd75" : "#9ab0c2";

      if (hideFoundActive) {
        mapElement.classList.add('hide-found');
        map.closePopup();
      } else {
        mapElement.classList.remove('hide-found');
      }
    };

    function listenToFoundSupplies() {
      db.ref('found_supplies').on('value', (snapshot) => {
        globalFoundCoords.clear();
        const data = snapshot.val();
        if (data) {
          Object.keys(data).forEach(safeKey => {
            const key = safeKey.replace('_', ',');
            globalFoundCoords.add(key);
          });
        }

        markerInstances.forEach((marker, key) => {
          const itemData = registeredCoords.get(key);
          if (itemData) updateMarkerVisual(marker, key, itemData);
        });
      });
    }

    async function loadStaticData() {
      try {
        const res = await fetch('data.json');
        if (!res.ok) return;
        const data = await res.json();

        if (data.strongholds) {
          data.strongholds.forEach(group => {
            group.coordinates.forEach(pt => {
              const key = `${pt.x},${pt.y}`;
              registeredCoords.set(key, {
                x: pt.x,
                y: pt.y,
                label: group.label,
                level: group.level,
                color: group.color
              });
              createPin(pt.x, pt.y, group.label, group.color);
            });
          });
        }
      } catch (err) {
        console.error("Error reading data.json:", err);
      }
    }

    function listenToCustomPins() {
      db.ref('custom_markers').on('child_added', (snapshot) => {
        const pt = snapshot.val();
        const key = `${pt.x},${pt.y}`;
        if (!registeredCoords.has(key)) {
          registeredCoords.set(key, { x: pt.x, y: pt.y, label: pt.type, color: '#f0bd75' });
          createPin(pt.x, pt.y, pt.type, '#f0bd75');
        }
      });
    }

    async function init() {
      await loadStaticData();
      listenToCustomPins();
      listenToFoundSupplies();
    }
    init();

    function submitCoordinate() {
      const x = parseInt(document.getElementById('input-x').value, 10);
      const y = parseInt(document.getElementById('input-y').value, 10);
      const type = document.getElementById('input-type').value;

      if (isNaN(x) || isNaN(y)) {
        showStatus("Enter both X and Y coordinates.", 'error');
        return;
      }

      const key = `${x},${y}`;

      if (registeredCoords.has(key)) {
        const marker = markerInstances.get(key);
        map.flyTo([y, x], 2);
        if (marker) marker.openPopup();

        if (globalFoundCoords.has(key)) {
          showStatus(`Already marked at (${x}, ${y})!`, 'error');
        } else {
          toggleFoundFirebase(key);
        }
        return;
      }

      const safeKey = `${x}_${y}`;
      db.ref(`custom_markers/${safeKey}`).set({
        x: x,
        y: y,
        type: type,
        timestamp: Date.now()
      });

      map.flyTo([y, x], 1.6);
      showStatus(`Saved new spot at (${x}, ${y})!`, 'success');
    }
  </script>
</body>
</html>
