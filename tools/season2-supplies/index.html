<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRIMM [grmm] — S2 Scattered Supplies Tracker</title>
  
  <!-- Leaflet & Nordic Fonts -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ice: #dcecff;
      --ice-dim: #8ea9c2;
      --steel: #607487;
      --dark: #070a0e;
      --fire: #d18a45;
      --fire-light: #f0bd75;
      --white: #f4f7fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html {
      height: 100%;
      background: var(--dark);
      font-family: 'Inter', sans-serif;
      color: var(--white);
      overflow: hidden;
    }

    #map { width: 100%; height: 100vh; background: #070a0e; }

/* =========================================
       NAVIGATION BAR & BRAND (MAIN SITE MATCH)
    ========================================= */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      z-index: 1000;
      pointer-events: none; /* Allows clicking the map beneath empty space */
      background: linear-gradient(
        to bottom,
        rgba(4, 7, 10, 0.9),
        rgba(4, 7, 10, 0)
      );
    }

    .nav-brand {
      pointer-events: auto; /* Re-enables clicking the brand link */
      font-family: "Cinzel", serif;
      font-weight: 700;
      letter-spacing: 5px;
      font-size: 18px;
      color: var(--ice);
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .nav-brand:hover {
      opacity: 0.85;
    }

    .nav-brand small {
      display: block;
      font-family: "Inter", sans-serif;
      font-size: 8px;
      letter-spacing: 4px;
      color: var(--ice-dim);
      margin-top: 2px;
      text-transform: none;
    }

    /* =========================================
       MAP HUD & SCOUT CONTROLS
    ========================================= */
    .top-panel {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      background: rgba(12, 17, 23, 0.85);
      border: 1px solid rgba(160, 190, 210, 0.25);
      border-radius: 6px;
      padding: 8px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
    }

    .coord-field {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #090d12;
      border: 1px solid rgba(160, 190, 210, 0.2);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .coord-field span {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--fire-light);
      font-size: 11px;
    }

    .coord-field input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 46px;
      font-weight: 600;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }

    select.type-select {
      background: #090d12;
      border: 1px solid rgba(160, 190, 210, 0.2);
      color: var(--white);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.5px;
      outline: none;
      cursor: pointer;
    }

    .btn-action {
      background: rgba(209, 138, 69, 0.2);
      border: 1px solid rgba(209, 138, 69, 0.6);
      color: var(--fire-light);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover { 
      background: rgba(209, 138, 69, 0.35);
      color: #fff;
    }

    .btn-secondary {
      background: #141b22;
      border: 1px solid rgba(160, 190, 210, 0.2);
      color: #9ab0c2;
      padding: 6px 12px;
      border-radius: 4px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: #1c2530;
      color: var(--fire-light);
      border-color: rgba(209, 138, 69, 0.4);
    }

    /* Floating Bottom-Right Coordinates */
    .hud-coords {
      position: absolute;
      bottom: 18px;
      right: 18px;
      z-index: 1000;
      background: rgba(12, 17, 23, 0.85);
      border: 1px solid rgba(160, 190, 210, 0.25);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #8ea9c2;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
    }
    .hud-coords b { color: var(--fire-light); }

    /* Notifications */
    #status-msg {
      position: absolute;
      top: 74px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      font-size: 11px;
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 4px;
      display: none;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    .msg-error { background: #5c1818; color: #ffb4b4; border: 1px solid #c73838; }
    .msg-info { background: #183149; color: #9fd2ff; border: 1px solid #2f6ea3; }
    .msg-success { background: #164024; color: #9df0b6; border: 1px solid #288046; }

    /* Pins */
    .stronghold-pin {
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.95);
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .stronghold-pin:hover {
      transform: scale(1.6);
      z-index: 9999 !important;
    }

    .stronghold-pin.is-found {
      opacity: 0.22 !important;
      border-color: #3b434a !important;
      filter: grayscale(100%);
    }

    #map.hide-found .stronghold-pin.is-found {
      display: none !important;
    }

    /* Leaflet Popup Styling */
    .leaflet-popup-content-wrapper {
      background: rgba(12, 17, 23, 0.95) !important;
      border: 1px solid rgba(209, 138, 69, 0.4) !important;
      border-radius: 4px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9) !important;
      color: #c4d0dc !important;
    }
    .leaflet-popup-tip {
      background: rgba(12, 17, 23, 0.95) !important;
      border: 1px solid rgba(209, 138, 69, 0.4) !important;
    }

    .popup-btn {
      display: inline-block;
      width: 100%;
      margin-top: 10px;
      padding: 7px 0;
      font-size: 11px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      transition: filter 0.2s ease;
    }
    .btn-mark {
      background: linear-gradient(135deg, #266b37, #1d4e2a);
      border: 1px solid #3eb85d;
      color: #fff;
    }
    .btn-mark:hover { filter: brightness(1.2); }
    .btn-unmark {
      background: #21262d;
      border: 1px solid rgba(160, 190, 210, 0.2);
      color: #8b949e;
    }
    .btn-unmark:hover { background: #2f3640; color: #fff; }

    /* =========================================
       VIEWER vs SCOUT PERMISSIONS
    ========================================= */
    body.viewer-mode .coord-field,
    body.viewer-mode select.type-select,
    body.viewer-mode .btn-action {
      display: none !important;
    }

    body.viewer-mode .popup-scout-only {
      display: none !important;
    }

    .viewer-notice {
      display: none;
      font-size: 10px;
      color: #7f95a6;
      font-style: italic;
      margin-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 6px;
    }
    body.viewer-mode .viewer-notice {
      display: block;
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <nav>
    <a href="../../#home" class="nav-brand">
      GRIMM
      <small>[ grmm ]</small>
    </a>
  </nav>

  <!-- Top Action Panel -->
  <div class="top-panel" id="scout-controls">
    <div class="coord-field">
      <span>X</span>
      <input type="number" id="input-x" placeholder="0" min="0" max="1000" />
    </div>
    <div class="coord-field">
      <span>Y</span>
      <input type="number" id="input-y" placeholder="0" min="0" max="1000" />
    </div>

    <select id="input-type" class="type-select">
      <option value="Level 1">Level 1</option>
      <option value="Level 2">Level 2</option>
      <option value="Level 3">Level 3</option>
      <option value="Level 4">Level 4</option>
      <option value="Level 5">Level 5</option>
      <option value="Level 6">Level 6</option>
      <option value="Level 7">Level 7</option>
      <option value="Custom Spot">Custom Spot</option>
    </select>

    <button class="btn-action" onclick="submitCoordinate()">Submit / Mark</button>
    <button class="btn-secondary" id="toggle-found-btn" onclick="toggleHideFound()">Hide Found</button>
    <button class="btn-secondary" id="auth-scout-btn" onclick="toggleScoutAuth()" style="border-color: rgba(209, 138, 69, 0.5); color: var(--fire-light);">
      🔒 Scout Login
    </button>
  </div>

  <div class="hud-coords" id="hud-coords">X: 0 | Y: 0</div>
  <div id="status-msg"></div>
  <div id="map"></div>

  <!-- Leaflet and Firebase Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const FIREBASE_DB_URL = "https://season-2-supplies-default-rtdb.europe-west1.firebasedatabase.app/";
    const SCOUT_PASSKEY = "SCOUT_HONOR"; // Change this whenever needed

    firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
    const db = firebase.database();

    const MAP_LIMIT = 1000;
    const registeredCoords = new Map();
    const markerInstances = new Map();
    const globalFoundCoords = new Set();
    let hideFoundActive = false;
    let isScout = localStorage.getItem("grimm_scout_auth") === "true";

    // --------------------------------------------------
    // SCOUT AUTHENTICATION HANDLING
    // --------------------------------------------------
    function updateScoutUI() {
      const authBtn = document.getElementById("auth-scout-btn");
      if (isScout) {
        document.body.classList.remove("viewer-mode");
        if (authBtn) {
          authBtn.innerHTML = "🔓 Scout: Active";
          authBtn.style.color = "#40bf6a";
          authBtn.style.borderColor = "#40bf6a";
        }
      } else {
        document.body.classList.add("viewer-mode");
        if (authBtn) {
          authBtn.innerHTML = "🔒 Scout Login";
          authBtn.style.color = "var(--fire-light)";
          authBtn.style.borderColor = "rgba(209, 138, 69, 0.5)";
        }
      }
    }

    window.toggleScoutAuth = function() {
      if (isScout) {
        if (confirm("Lock map back to spectator/view-only mode?")) {
          isScout = false;
          localStorage.removeItem("grimm_scout_auth");
          updateScoutUI();
          showStatus("Switched to Spectator Mode.", "info");
        }
        return;
      }

      const input = prompt("ᚦ ENTER ALLIANCE SCOUT PASSPHRASE:");
      if (input === SCOUT_PASSKEY) {
        isScout = true;
        localStorage.setItem("grimm_scout_auth", "true");
        updateScoutUI();
        showStatus("Scout permissions verified!", "success");
      } else if (input !== null) {
        showStatus("Invalid passphrase.", "error");
      }
    };

    // --------------------------------------------------
    // MAP SETUP & EVENTS
    // --------------------------------------------------
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1.5,
      maxZoom: 3,
      zoomSnap: 0.25,
      zoomDelta: 0.5,
      attributionControl: false
    });

    const bounds = [[0, 0], [MAP_LIMIT, MAP_LIMIT]];
    L.imageOverlay('season-2-grid.png', bounds).addTo(map);
    map.fitBounds(bounds);

    map.on('mousemove', (e) => {
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);
      if (x >= 0 && x <= MAP_LIMIT && y >= 0 && y <= MAP_LIMIT) {
        document.getElementById('hud-coords').innerHTML = `X: <b>${x}</b> | Y: <b>${y}</b>`;
      }
    });

    function showStatus(text, type = 'info') {
      const box = document.getElementById('status-msg');
      box.className = type === 'error' ? 'msg-error' : (type === 'success' ? 'msg-success' : 'msg-info');
      box.textContent = text;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    window.toggleFoundFirebase = function(key) {
      if (!isScout) {
        showStatus("Only authorized scouts can modify spots.", "error");
        return;
      }

      const isFound = globalFoundCoords.has(key);
      const safeKey = key.replace(',', '_');

      if (isFound) {
        db.ref(`found_supplies/${safeKey}`).remove();
        showStatus(`Unmarked (${key.replace('_', ',')})`, 'info');
      } else {
        db.ref(`found_supplies/${safeKey}`).set({
          timestamp: Date.now()
        });
        showStatus(`Marked found for everyone!`, 'success');
      }
    };

    function updateMarkerVisual(marker, key, data) {
      const isFound = globalFoundCoords.has(key);
      const titleColor = data.color === '#00FF00' ? '#00e600' : data.color;

      const icon = L.divIcon({
        className: `stronghold-pin ${isFound ? 'is-found' : ''}`,
        html: `<div style="width:100%;height:100%;background:${data.color};border-radius:50%;"></div>`,
        iconSize: [11, 11],
        iconAnchor: [5.5, 5.5]
      });
      marker.setIcon(icon);

      const popupHtml = `
        <div style="color: #c4d0dc; font-size: 12px; font-family: 'Inter', sans-serif; min-width: 150px; padding: 4px 2px;">
          <strong style="color: ${titleColor}; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.5px; text-shadow: 0 0 8px ${titleColor}40;">${data.label}</strong><br/>
          <div style="margin: 4px 0; color: #8ea9c2; font-family: 'JetBrains Mono', monospace;">
            Coords: <b style="color: #fff;">(${data.x}, ${data.y})</b>
          </div>
          <div style="font-size: 11px; font-weight: 700; color:${isFound ? '#40bf6a' : '#d18a45'}; margin-bottom: 6px;">
            ${isFound ? '✓ Marked Found' : '⭕ Unclaimed'}
          </div>

          <div class="popup-scout-only">
            <button 
              class="popup-btn ${isFound ? 'btn-unmark' : 'btn-mark'}" 
              onclick="toggleFoundFirebase('${key}')">
              ${isFound ? 'Mark Unclaimed' : '✓ 1-Click Mark Found'}
            </button>
          </div>

          <div class="viewer-notice">
            🔒 Spectator view (Authorized scouts can mark)
          </div>
        </div>
      `;
      marker.bindPopup(popupHtml);
    }

    function createPin(x, y, label, color) {
      const key = `${x},${y}`;
      const marker = L.marker([y, x]).addTo(map);

      markerInstances.set(key, marker);
      updateMarkerVisual(marker, key, { x, y, label, color });
      return marker;
    }

    window.toggleHideFound = function() {
      hideFoundActive = !hideFoundActive;
      const btn = document.getElementById('toggle-found-btn');
      const mapElement = document.getElementById('map');

      btn.textContent = hideFoundActive ? "Show Found" : "Hide Found";
      btn.style.borderColor = hideFoundActive ? "rgba(209, 138, 69, 0.6)" : "rgba(160, 190, 210, 0.2)";
      btn.style.color = hideFoundActive ? "var(--fire-light)" : "#9ab0c2";

      if (hideFoundActive) {
        mapElement.classList.add('hide-found');
        map.closePopup();
      } else {
        mapElement.classList.remove('hide-found');
      }
    };

    function listenToFoundSupplies() {
      db.ref('found_supplies').on('value', (snapshot) => {
        globalFoundCoords.clear();
        const data = snapshot.val();
        if (data) {
          Object.keys(data).forEach(safeKey => {
            const key = safeKey.replace('_', ',');
            globalFoundCoords.add(key);
          });
        }

        markerInstances.forEach((marker, key) => {
          const itemData = registeredCoords.get(key);
          if (itemData) updateMarkerVisual(marker, key, itemData);
        });
      });
    }

    async function loadStaticData() {
      try {
        const res = await fetch('data.json');
        if (!res.ok) return;
        const data = await res.json();

        if (data.strongholds) {
          data.strongholds.forEach(group => {
            group.coordinates.forEach(pt => {
              const key = `${pt.x},${pt.y}`;
              registeredCoords.set(key, {
                x: pt.x,
                y: pt.y,
                label: group.label,
                level: group.level,
                color: group.color
              });
              createPin(pt.x, pt.y, group.label, group.color);
            });
          });
        }
      } catch (err) {
        console.error("Error reading data.json:", err);
      }
    }

    function listenToCustomPins() {
      db.ref('custom_markers').on('child_added', (snapshot) => {
        const pt = snapshot.val();
        const key = `${pt.x},${pt.y}`;
        if (!registeredCoords.has(key)) {
          registeredCoords.set(key, { x: pt.x, y: pt.y, label: pt.type, color: '#f0bd75' });
          createPin(pt.x, pt.y, pt.type, '#f0bd75');
        }
      });
    }

    async function init() {
      updateScoutUI();
      await loadStaticData();
      listenToCustomPins();
      listenToFoundSupplies();
    }
    init();

    function submitCoordinate() {
      if (!isScout) {
        showStatus("Only authorized scouts can submit coordinates.", "error");
        return;
      }

      const x = parseInt(document.getElementById('input-x').value, 10);
      const y = parseInt(document.getElementById('input-y').value, 10);
      const type = document.getElementById('input-type').value;

      if (isNaN(x) || isNaN(y)) {
        showStatus("Enter both X and Y coordinates.", 'error');
        return;
      }

      const key = `${x},${y}`;

      if (registeredCoords.has(key)) {
        const marker = markerInstances.get(key);
        map.flyTo([y, x], 2);
        if (marker) marker.openPopup();

        if (globalFoundCoords.has(key)) {
          showStatus(`Already marked at (${x}, ${y})!`, 'error');
        } else {
          toggleFoundFirebase(key);
        }
        return;
      }

      const safeKey = `${x}_${y}`;
      db.ref(`custom_markers/${safeKey}`).set({
        x: x,
        y: y,
        type: type,
        timestamp: Date.now()
      });

      map.flyTo([y, x], 1.6);
      showStatus(`Saved new spot at (${x}, ${y})!`, 'success');
    }
  </script>
</body>
</html>
